name: token-meter
permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "llm/token-meter/**"
      - ".github/workflows/token-meter.yml"
  pull_request:
    branches:
      - main
    paths:
      - "llm/token-meter/**"
      - ".github/workflows/token-meter.yml"

jobs:
  token-meter-build:
    name: Build & Test - Token Meter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./llm/token-meter

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.11.0

      - name: Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
